<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e32">
<meta name="description" content="손끝에서 점자메뉴판이 비치된 매장과 메뉴판 이용 방법을 확인하세요.">
<title>손끝 — 점자메뉴판 찾기</title>
<link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<header class="header"><div class="header-inner">
<a class="brand" href="#">점자메뉴판 보유 매장 찾기</a>
<nav aria-label="주 메뉴"><a href="#" id="nav-stores" aria-current="page">매장 찾기</a><a href="#guide" id="nav-guide">이용 안내</a></nav>
<button id="settings" class="settings" aria-label="화면 보기 설정" aria-expanded="false" aria-controls="view-settings">가<span aria-hidden="true">＋</span></button>
</div></header>
<section id="view-settings" class="view-settings" aria-label="화면 보기 설정" hidden><div class="settings-inner"><label for="font-size">글자 크기</label><select id="font-size"><option value="100">기본</option><option value="125">크게</option><option value="150">아주 크게</option></select><label class="contrast"><input type="checkbox" id="contrast"> 고대비 화면</label></div></section>
<main id="main" tabindex="-1"></main>

<p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
